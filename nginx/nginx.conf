worker_processes auto;
pid /tmp/nginx.pid;
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression (applied to non-SSE API traffic)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss text/javascript;

    # Upstream Definitions for MCP Services
    upstream facebook_backend {
        server facebook-marketplace-mcp:3000;
        keepalive 32;
    }

    upstream shopee_backend {
        server shopee-indonesia-mcp:3000;
        keepalive 32;
    }

    upstream tokopedia_backend {
        server tokopedia-mcp:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name mcp.cuang.dev localhost;

        # Client body size for file/image uploads or large JSON payloads
        client_max_body_size 10M;

        # Gateway Health Aggregator
        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","gateway":"mcp.cuang.dev","timestamp":"$time_iso8601","services":["facebook","shopee","tokopedia"]}';
        }

        # -------------------------------------------------------------
        # 1. Facebook Marketplace MCP Service (/facebook)
        # -------------------------------------------------------------
        location /facebook/ {
            # Strip /facebook prefix before proxying to container
            rewrite ^/facebook/(.*) /$1 break;

            proxy_pass http://facebook_backend;

            # HTTP 1.1 with persistent connection for SSE and HTTP streaming
            proxy_http_version 1.1;
            proxy_set_header Connection '';

            # SSE Streaming optimizations
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # Forwarding headers (informs app of reverse proxy prefix)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /facebook;
        }

        # Redirect exact /facebook to /facebook/
        location = /facebook {
            return 301 $scheme://$http_host/facebook/;
        }

        # -------------------------------------------------------------
        # 2. Shopee Indonesia MCP Service (/shopee)
        # -------------------------------------------------------------
        location /shopee/ {
            rewrite ^/shopee/(.*) /$1 break;

            proxy_pass http://shopee_backend;

            proxy_http_version 1.1;
            proxy_set_header Connection '';

            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /shopee;
        }

        location = /shopee {
            return 301 $scheme://$http_host/shopee/;
        }

        # -------------------------------------------------------------
        # 3. Tokopedia MCP Service (/tokopedia)
        # -------------------------------------------------------------
        location /tokopedia/ {
            rewrite ^/tokopedia/(.*) /$1 break;

            proxy_pass http://tokopedia_backend;

            proxy_http_version 1.1;
            proxy_set_header Connection '';

            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /tokopedia;
        }

        location = /tokopedia {
            return 301 $scheme://$http_host/tokopedia/;
        }

        # Gateway Root Index
        location / {
            default_type application/json;
            return 200 '{"platform":"mcp.cuang.dev","version":"1.0.0","description":"Unified Model Context Protocol (MCP) and REST Gateway for E-Commerce Platforms","endpoints":{"facebook":"https://mcp.cuang.dev/facebook/","shopee":"https://mcp.cuang.dev/shopee/","tokopedia":"https://mcp.cuang.dev/tokopedia/"},"protocols":["stdio","sse","http"]}';
        }
    }
}
